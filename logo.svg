  <!-- Hair Framing -->
  <rect x="8" y="8" width="2" height="12" fill="#613a2d"/>
  <rect x="22" y="8" width="2" height="12" fill="#613a2d"/>
  <rect x="9" y="8" width="1" height="6" fill="#784a3a"/>
