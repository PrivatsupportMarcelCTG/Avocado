  <rect x="20" y="11" width="2" height="1" fill="#1e1412"/>
  <!-- Face -->
  <rect x="10" y="8" width="12" height="10" fill="#fce0d4"/>
  <rect x="11" y="18" width="10" height="2" fill="#fce0d4"/>
